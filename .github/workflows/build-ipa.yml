name: Build PencilSlide Sera IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler and SDK
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
      - name: Check repository structure
        run: python3 Scripts/validate_project.py
      - name: Run production gesture and autoplay core checks
        shell: bash
        run: |
          set -euo pipefail
          swiftc PencilSlide/PencilTapPattern.swift PencilSlide/SlideshowClock.swift Tests/main.swift -o "$RUNNER_TEMP/pencilslide-core-tests"
          "$RUNNER_TEMP/pencilslide-core-tests" | tee core-tests.log
      - name: Validate Xcode project
        run: |
          plutil -lint PencilSlide.xcodeproj/project.pbxproj
          plutil -lint PencilSlide/Info.plist
          xcodebuild -list -project PencilSlide.xcodeproj
      - name: Compile unsigned physical iPad application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project PencilSlide.xcodeproj -scheme PencilSlide \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Validate app and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/PencilSlide.app
          test -f "$APP/PencilSlide"
          test -f "$APP/Assets.car"
          plutil -lint "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.pencilsuite.pencilslide
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIStatusBarHidden' "$APP/Info.plist")" = true
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist"
          lipo -verify_arch arm64 "$APP/PencilSlide"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          /usr/bin/zip -qry PencilSlide-Sera-unsigned.ipa Payload
          unzip -t PencilSlide-Sera-unsigned.ipa
          shasum -a 256 PencilSlide-Sera-unsigned.ipa > SHA256.txt
      - name: Upload installable input for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: PencilSlide-Sera-unsigned
          path: |
            dist/PencilSlide-Sera-unsigned.ipa
            dist/SHA256.txt
          retention-days: 3
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PencilSlide-Sera-build-logs
          path: |
            core-tests.log
            build.log
          retention-days: 3
          if-no-files-found: ignore
